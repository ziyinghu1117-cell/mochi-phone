<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Phone Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 手机模拟器容器 -->
    <div id="phone-container" class="phone-container">
        <div class="phone-frame">
            <!-- 状态栏 -->
            <div id="status-bar" class="status-bar">
                <div class="status-left">
                    <span id="status-time">12:00</span>
                </div>
                <div class="status-center">
                    <div class="notch"></div>
                </div>
                <div class="status-right">
                    <span class="status-icon">📶</span>
                    <span class="status-icon">🔋</span>
                    <span id="status-battery">100%</span>
                </div>
            </div>
            <!-- 主屏幕区域 -->
            <div id="screen" class="screen">
                <!-- 桌面 -->
                <div id="home-screen" class="home-screen active">
                    <div class="wallpaper"></div>
                    <div class="app-grid">
                        <!-- 第一行 -->
                        <div class="app-icon" data-app="chat">
                            <div class="icon-wrapper chat-icon">💬</div>
                            <span class="app-name">AI聊天</span>
                        </div>
                        <div class="app-icon" data-app="game">
                            <div class="icon-wrapper game-icon">🎮</div>
                            <span class="app-name">AI文游</span>
                        </div>
                        <div class="app-icon" data-app="worldbook">
                            <div class="icon-wrapper worldbook-icon">📚</div>
                            <span class="app-name">世界书</span>
                        </div>
                        <div class="app-icon" data-app="editor">
                            <div class="icon-wrapper editor-icon">✏️</div>
                            <span class="app-name">剧本编辑</span>
                        </div>
                        <!-- 第二行 -->
                        <div class="app-icon" data-app="settings">
                            <div class="icon-wrapper settings-icon">⚙️</div>
                            <span class="app-name">设置</span>
                        </div>
                        <div class="app-icon" data-app="gallery">
                            <div class="icon-wrapper gallery-icon">🖼️</div>
                            <span class="app-name">相册</span>
                        </div>
                        <div class="app-icon" data-app="music">
                            <div class="icon-wrapper music-icon">🎵</div>
                            <span class="app-name">音乐</span>
                        </div>
                        <div class="app-icon" data-app="weather">
                            <div class="icon-wrapper weather-icon">☀️</div>
                            <span class="app-name">天气</span>
                        </div>
                    </div>
                    
                    <!-- Dock栏 -->
                    <div class="dock">
                        <div class="dock-icon" data-app="chat">
                            <div class="icon-wrapper chat-icon">💬</div>
                        </div>
                        <div class="dock-icon" data-app="game">
                            <div class="icon-wrapper game-icon">🎮</div>
                        </div>
                        <div class="dock-icon" data-app="worldbook">
                            <div class="icon-wrapper worldbook-icon">📚</div>
                        </div>
                        <div class="dock-icon" data-app="settings">
                            <div class="icon-wrapper settings-icon">⚙️</div>
                        </div>
                    </div>
                    
                    <!-- 底部指示条 -->
                    <div class="home-indicator"></div>
                </div>
                <!-- AI聊天应用 -->
                <div id="chat-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">AI聊天</h2>
                        <button class="header-btn" data-action="new-chat">+</button>
                    </div>
                    <div class="chat-sidebar">
                        <div class="chat-list" id="chat-list">
                            <!-- 聊天列表动态生成 -->
                        </div>
                    </div>
                    <div class="chat-main">
                        <div class="chat-messages" id="chat-messages">
                            <!-- 消息动态生成 -->
                        </div>
                        <div class="chat-input-area">
                            <div class="chat-input-wrapper">
                                <textarea id="chat-input" placeholder="输入消息..." rows="1"></textarea>
                                <button id="chat-send" class="send-btn">发送</button>
                            </div>
                            <div class="chat-tools">
                                <button class="tool-btn" data-tool="emoji">😊</button>
                                <button class="tool-btn" data-tool="character">👤</button>
                                <button class="tool-btn" data-tool="worldbook">🌍</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- AI文游应用 -->
                <div id="game-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">AI文游</h2>
                        <button class="header-btn" data-action="game-menu">⋮</button>
                    </div>
                    <div class="game-sidebar">
                        <div class="game-stats">
                            <div class="stat-item">
                                <span class="stat-label">角色</span>
                                <span class="stat-value" id="game-character">未选择</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">世界</span>
                                <span class="stat-value" id="game-world">默认</span>
                            </div>
                        </div>
                        <div class="game-attributes" id="game-attributes">
                            <!-- 属性状态栏动态生成 -->
                        </div>
                        <div class="game-saves">
                            <h3>存档</h3>
                            <div class="save-list" id="save-list">
                                <!-- 存档列表动态生成 -->
                            </div>
                            <button class="btn-primary" id="btn-save">保存进度</button>
                            <button class="btn-secondary" id="btn-load">读取存档</button>
                        </div>
                    </div>
                    <div class="game-main">
                        <div class="game-story" id="game-story">
                            <!-- 故事内容动态生成 -->
                        </div>
                        <div class="game-input-area">
                            <div class="game-actions" id="game-actions">
                                <!-- 动作选项动态生成 -->
                            </div>
                            <div class="game-input-wrapper">
                                <input type="text" id="game-input" placeholder="自由输入你的行动...">
                                <button id="game-submit" class="send-btn">执行</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 世界书应用 -->
                <div id="worldbook-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">世界书</h2>
                        <button class="header-btn" data-action="add-world">+</button>
                    </div>
                    <div class="worldbook-tabs">
                        <button class="tab-btn active" data-tab="worlds">世界观</button>
                        <button class="tab-btn" data-tab="characters">角色卡</button>
                        <button class="tab-btn" data-tab="locations">地点卡</button>
                    </div>
                    <div class="worldbook-content">
                        <div class="tab-content active" id="tab-worlds">
                            <div class="world-list" id="world-list">
                                <!-- 世界观列表动态生成 -->
                            </div>
                        </div>
                        <div class="tab-content" id="tab-characters">
                            <div class="character-list" id="character-list">
                                <!-- 角色卡列表动态生成 -->
                            </div>
                        </div>
                        <div class="tab-content" id="tab-locations">
                            <div class="location-list" id="location-list">
                                <!-- 地点卡列表动态生成 -->
                            </div>
                        </div>
                    </div>
                    <div class="worldbook-footer">
                        <button class="btn-secondary" id="btn-import">导入JSON</button>
                        <button class="btn-secondary" id="btn-export">导出JSON</button>
                    </div>
                </div>
                <!-- 剧本编辑器应用 -->
                <div id="editor-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">剧本编辑器</h2>
                        <button class="header-btn" data-action="editor-menu">⋮</button>
                    </div>
                    <div class="editor-toolbar">
                        <button class="tool-btn" data-tool="add-node">+ 节点</button>
                        <button class="tool-btn" data-tool="add-branch">+ 分支</button>
                        <button class="tool-btn" data-tool="preview">▶ 预览</button>
                        <button class="tool-btn" data-tool="save">💾 保存</button>
                    </div>
                    <div class="editor-canvas" id="editor-canvas">
                        <!-- 节点式编辑器动态生成 -->
                        <svg class="editor-connections" id="editor-connections"></svg>
                        <div class="editor-nodes" id="editor-nodes">
                            <!-- 节点动态生成 -->
                        </div>
                    </div>
                    <div class="editor-properties" id="editor-properties">
                        <h3>节点属性</h3>
                        <div class="property-panel">
                            <label>节点标题</label>
                            <input type="text" id="node-title" placeholder="输入节点标题">
                            <label>节点内容</label>
                            <textarea id="node-content" placeholder="输入剧情内容..." rows="4"></textarea>
                            <label>分支选项</label>
                            <div id="node-branches" class="branches-list">
                                <!-- 分支列表动态生成 -->
                            </div>
                            <button class="btn-primary" id="btn-add-branch">添加分支</button>
                        </div>
                    </div>
                </div>
                <!-- 设置应用 -->
                <div id="settings-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">设置</h2>
                    </div>
                    <div class="settings-content">
                        <div class="settings-section">
                            <h3>API配置</h3>
                            <div class="setting-item">
                                <label>API地址</label>
                                <input type="text" id="setting-api-url" placeholder="https://api.example.com/v1">
                            </div>
                            <div class="setting-item">
                                <label>API密钥</label>
                                <input type="password" id="setting-api-key" placeholder="sk-...">
                            </div>
                            <div class="setting-item">
                                <label>默认模型</label>
                                <select id="setting-model">
                                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                                    <option value="gpt-4">GPT-4</option>
                                    <option value="gpt-4o">GPT-4o</option>
                                </select>
                            </div>
                            <div class="setting-item">
                                <label>温度 (0-1)</label>
                                <input type="range" id="setting-temperature" min="0" max="1" step="0.1" value="0.7">
                                <span id="temp-value">0.7</span>
                            </div>
                            <button class="btn-primary" id="btn-test-api">测试连接</button>
                        </div>
                        
                        <div class="settings-section">
                            <h3>界面设置</h3>
                            <div class="setting-item">
                                <label>主题</label>
                                <select id="setting-theme">
                                    <option value="light">浅色</option>
                                    <option value="dark">深色</option>
                                    <option value="auto">跟随系统</option>
                                </select>
                            </div>
                            <div class="setting-item">
                                <label>字体大小</label>
                                <select id="setting-font-size">
                                    <option value="small">小</option>
                                    <option value="medium" selected>中</option>
                                    <option value="large">大</option>
                                </select>
                            </div>
                            <div class="setting-item">
                                <label>打字机效果</label>
                                <input type="checkbox" id="setting-typewriter" checked>
                            </div>
                        </div>
                        
                        <div class="settings-section">
                            <h3>数据管理</h3>
                            <button class="btn-secondary" id="btn-export-all">导出全部数据</button>
                            <button class="btn-secondary" id="btn-import-all">导入数据</button>
                            <button class="btn-danger" id="btn-clear-data">清除所有数据</button>
                        </div>
                        
                        <div class="settings-section">
                            <h3>关于</h3>
                            <p>AI Phone Simulator v1.0.0</p>
                            <p>一个集成AI聊天、文游、世界书、剧本编辑的沉浸式互动平台</p>
                        </div>
                    </div>
                </div>
                <!-- 相册应用 (占位) -->
                <div id="gallery-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">相册</h2>
                    </div>
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🖼️</div>
                        <p>相册功能开发中...</p>
                    </div>
                </div>
                <!-- 音乐应用 (占位) -->
                <div id="music-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">音乐</h2>
                    </div>
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🎵</div>
                        <p>音乐功能开发中...</p>
                    </div>
                </div>
                <!-- 天气应用 (占位) -->
                <div id="weather-app" class="app-screen">
                    <div class="app-header">
                        <button class="back-btn" data-action="back">←</button>
                        <h2 class="app-title">天气</h2>
                    </div>
                    <div class="placeholder-content">
                        <div class="placeholder-icon">☀️</div>
                        <p>天气功能开发中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">标题</h3>
                <button class="modal-close" id="modal-close">×</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- 模态框内容 -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <!-- 模态框按钮 -->
            </div>
        </div>
    </div>
    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>
    <!-- 脚本 -->
    <script src="app.js"></script>
</body>
</html>
