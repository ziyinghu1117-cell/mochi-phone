<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi AI Chat - 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
      color: white;
      padding: 20px 30px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 24px; }
    .header .subtitle { font-size: 14px; opacity: 0.9; margin-top: 4px; }
    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }

    /* 登录页面 */
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #666;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus {
      border-color: #FF6B9D;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #FF6B9D, #FF8E53);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { opacity: 0.9; }
    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
    }
    .btn-success {
      background: linear-gradient(135deg, #4CAF50, #45a049);
    }
    .btn-danger {
      background: linear-gradient(135deg, #f44336, #d32f2f);
    }

    .hidden { display: none !important; }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #FF6B9D;
    }

    /* Tab 导航 */
    .tabs {
      display: flex;
      background: white;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #FF6B9D, #FF8E53);
      color: white;
      font-weight: 500;
    }

    /* 表格 */
    .table-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    th {
      background: #fafafa;
      font-weight: 600;
      color: #666;
    }
    tr:hover {
      background: #fafafa;
    }
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-pending {
      background: #FFF3E0;
      color: #FF9800;
    }
    .status-completed {
      background: #E8F5E9;
      color: #4CAF50;
    }
    .status-rejected {
      background: #FFEBEE;
      color: #f44336;
    }
    .actions {
      display: flex;
      gap: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 9999;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .header { padding: 16px; }
      .header h1 { font-size: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登录页面 -->
    <div id="loginPage">
      <div class="login-box">
        <h2>🔐 管理员登录</h2>
        <div class="form-group">
          <label class="form-label">管理员密码</label>
          <input type="password" id="adminPassword" class="form-input" placeholder="请输入管理员密码">
        </div>
        <button class="btn" onclick="adminLogin()">登录</button>
      </div>
    </div>

    <!-- 管理后台页面 -->
    <div id="adminPage" class="hidden">
      <div class="header">
        <div>
          <h1>🎀 Mochi AI Chat 管理后台</h1>
          <div class="subtitle">数据管理中心</div>
        </div>
        <button class="logout-btn" onclick="adminLogout()">退出登录</button>
      </div>

      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">总用户数</div>
          <div class="stat-value" id="statUsers">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总米粒数</div>
          <div class="stat-value" id="statRice">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总充值金额</div>
          <div class="stat-value" id="statRecharge">¥0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">待处理充值</div>
          <div class="stat-value" id="statPending">0</div>
        </div>
      </div>

      <!-- Tab 导航 -->
      <div class="tabs">
        <div class="tab active" data-tab="recharge" onclick="switchTab('recharge')">充值管理</div>
        <div class="tab" data-tab="users" onclick="switchTab('users')">用户管理</div>
      </div>

      <!-- 充值管理 -->
      <div id="tabRecharge">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>订单号</th>
                <th>用户</th>
                <th>金额</th>
                <th>米粒</th>
                <th>状态</th>
                <th>时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="rechargeList">
              <tr><td colspan="7" style="text-align:center;color:#999;padding:40px">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 用户管理 -->
      <div id="tabUsers" class="hidden">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>昵称</th>
                <th>米粒余额</th>
                <th>注册时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="usersList">
              <tr><td colspan="6" style="text-align:center;color:#999;padding:40px">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const AdminState = {
      token: '',
      isLoggedIn: false,
      currentTab: 'recharge'
    };

    // ==================== 登录 ====================
    async function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      if (!password) {
        showToast('请输入管理密码');
        return;
      }

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '登录失败');
        }

        AdminState.token = data.data.token;
        AdminState.isLoggedIn = true;

        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('adminPage').classList.remove('hidden');

        loadStats();
        loadRechargeList();
        showToast('登录成功');
      } catch (err) {
        showToast(err.message || '登录失败');
      }
    }

    function adminLogout() {
      AdminState.token = '';
      AdminState.isLoggedIn = false;
      document.getElementById('adminPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('adminPassword').value = '';
    }

    // ==================== API 请求 ====================
    async function apiRequest(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + AdminState.token,
        ...options.headers
      };

      const response = await fetch(path, { ...options, headers });
      const data = await response.json();

      if (!response.ok) {
        if (response.status === 401) {
          adminLogout();
          throw new Error('登录已过期，请重新登录');
        }
        throw new Error(data.error || '请求失败');
      }
      return data;
    }

    // ==================== Tab 切换 ====================
    function switchTab(tab) {
      AdminState.currentTab = tab;

      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });

      document.getElementById('tabRecharge').classList.toggle('hidden', tab !== 'recharge');
      document.getElementById('tabUsers').classList.toggle('hidden', tab !== 'users');

      if (tab === 'recharge') {
        loadRechargeList();
      } else if (tab === 'users') {
        loadUsersList();
      }
    }

    // ==================== 统计 ====================
    async function loadStats() {
      try {
        const res = await apiRequest('/api/admin/stats');
        if (res.success) {
          const d = res.data;
          document.getElementById('statUsers').textContent = d.totalUsers || 0;
          document.getElementById('statRice').textContent = d.totalRice || 0;
          document.getElementById('statRecharge').textContent = '¥' + (d.totalRecharge || 0);
          document.getElementById('statPending').textContent = d.pendingOrders || 0;
        }
      } catch (err) {
        console.error('加载统计失败:', err);
      }
    }

    // ==================== 充值管理 ====================
    async function loadRechargeList() {
      try {
        const res = await apiRequest('/api/admin/recharge/list');
        if (res.success) {
          const orders = res.data.list || [];
          const tbody = document.getElementById('rechargeList');

          if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:40px">暂无充值订单</td></tr>';
            return;
          }

          tbody.innerHTML = orders.map(order => {
            const statusClass = 'status-' + order.status;
            const statusText = {
              'pending': '待处理',
              'completed': '已完成',
              'rejected': '已拒绝'
            }[order.status] || order.status;

            const actions = order.status === 'pending' ? `
              <div class="actions">
                <button class="btn btn-sm btn-success" onclick="confirmRecharge('${order.id}')">确认</button>
                <button class="btn btn-sm btn-danger" onclick="rejectRecharge('${order.id}')">拒绝</button>
              </div>
            ` : '-';

            return `
              <tr>
                <td>${order.id}</td>
                <td>${order.username || '-'}</td>
                <td>¥${order.amount}</td>
                <td>${order.rice_amount}</td>
                <td><span class="status ${statusClass}">${statusText}</span></td>
                <td>${formatTime(order.created_at)}</td>
                <td>${actions}</td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error('加载充值列表失败:', err);
        document.getElementById('rechargeList').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:40px">加载失败</td></tr>';
      }
    }

    async function confirmRecharge(orderNo) {
      if (!confirm('确认该充值订单已到账？')) return;

      try {
        const res = await apiRequest('/api/admin/recharge/confirm', {
          method: 'POST',
          body: JSON.stringify({ orderId: orderId })
        });

        if (res.success) {
          showToast('充值已确认');
          loadStats();
          loadRechargeList();
        }
      } catch (err) {
        showToast(err.message || '操作失败');
      }
    }

    async function rejectRecharge(orderNo) {
      if (!confirm('确认拒绝该充值订单？')) return;

      try {
        const res = await apiRequest('/api/admin/recharge/reject', {
          method: 'POST',
          body: JSON.stringify({ orderId: orderId, reason: '管理员拒绝' })
        });

        if (res.success) {
          showToast('已拒绝');
          loadStats();
          loadRechargeList();
        }
      } catch (err) {
        showToast(err.message || '操作失败');
      }
    }

    // ==================== 用户管理 ====================
    async function loadUsersList() {
      try {
        const res = await apiRequest('/api/admin/users');
        if (res.success) {
          const users = res.data.list || [];
          const tbody = document.getElementById('usersList');

          if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px">暂无用户</td></tr>';
            return;
          }

          tbody.innerHTML = users.map(user => `
            <tr>
              <td>${user.id}</td>
              <td>${user.username}</td>
              <td>${user.nickname || '-'}</td>
              <td>${user.rice_balance || 0}</td>
              <td>${formatTime(user.created_at)}</td>
              <td>
                <button class="btn btn-sm" onclick="adjustRice(${user.id})">调整米粒</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('加载用户列表失败:', err);
        document.getElementById('usersList').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px">加载失败</td></tr>';
      }
    }

    async function adjustRice(userId) {
      const amount = prompt('请输入调整的米粒数（正数增加，负数减少）：');
      if (amount === null) return;

      const num = parseInt(amount);
      if (isNaN(num)) {
        showToast('请输入有效的数字');
        return;
      }

      try {
        const res = await apiRequest('/api/admin/user/adjust-rice', {
          method: 'POST',
          body: JSON.stringify({ user_id: userId, amount: num })
        });

        if (res.success) {
          showToast('调整成功');
          loadStats();
          loadUsersList();
        }
      } catch (err) {
        showToast(err.message || '操作失败');
      }
    }

    // ==================== 工具函数 ====================
    function formatTime(timestamp) {
      if (!timestamp) return '-';
      const d = new Date(timestamp);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${day} ${h}:${min}`;
    }

    function showToast(message, duration = 2000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // 回车登录
    document.getElementById('adminPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        adminLogin();
      }
    });
  </script>
</body>
</html>
