<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi AI Chat - 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
      color: white;
      padding: 20px 30px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 24px; }
    .header .subtitle { font-size: 14px; opacity: 0.9; margin-top: 4px; }
    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }

    /* 登录页面 */
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    .login-box .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #666;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #FF6B9D; }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      padding: 8px 16px;
      background: #f0f0f0;
      color: #666;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-secondary:hover { background: #e8e8e8; }
    .btn-danger {
      padding: 6px 12px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-danger:hover { background: #ff3838; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .stat-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: #333;
    }
    .stat-value.primary { color: #FF6B9D; }
    .stat-value.success { color: #2ed573; }
    .stat-value.warning { color: #ffa502; }

    /* 选项卡 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: white;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: #666;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
      color: white;
    }
    .tab:hover:not(.active) { background: #f5f5f5; }

    /* 面板 */
    .panel { display: none; }
    .panel.active { display: block; }

    /* 卡片 */
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #333;
    }

    /* 表单行 */
    .form-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .form-row .form-group { flex: 1; min-width: 120px; }

    /* 表格 */
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    th {
      background: #fafafa;
      font-weight: 600;
      color: #666;
    }
    tr:hover { background: #fafafa; }

    /* 状态标签 */
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status.active { background: #e8f5e9; color: #2ed573; }
    .status.used { background: #f5f5f5; color: #999; }
    .status.expired { background: #ffebee; color: #ff4757; }

    /* 兑换码列表 */
    .code-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .code-item {
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .code-item:hover { background: #e9ecef; }
    .code-item .copied {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .code-item.copied .copied { opacity: 1; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* 分页 */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .page-btn {
      padding: 6px 12px;
      border: 1px solid #e0e0e0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .page-btn.active {
      background: #FF6B9D;
      color: white;
      border-color: #FF6B9D;
    }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 登录页面 -->
    <div id="loginPage" class="login-box">
      <div class="logo">🍡</div>
      <h2>管理后台</h2>
      <div class="form-group">
        <label>管理密码</label>
        <input type="password" class="form-input" id="adminPassword" placeholder="请输入管理密码">
      </div>
      <button class="btn-primary" onclick="adminLogin()">登录</button>
    </div>

    <!-- 管理主页面 -->
    <div id="adminPage" class="hidden">
      <div class="container">
        <div class="header">
          <div>
            <h1>🍡 Mochi AI Chat 管理后台</h1>
            <div class="subtitle">兑换码管理 · 运营数据统计</div>
          </div>
          <button class="logout-btn" onclick="adminLogout()">退出登录</button>
        </div>

        <!-- 统计概览 -->
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="stat-label">总用户数</div>
            <div class="stat-value primary" id="statUsers">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">总米粒</div>
            <div class="stat-value" id="statRice">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">总充值</div>
            <div class="stat-value success" id="statRecharge">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">总消费</div>
            <div class="stat-value warning" id="statConsume">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">兑换码总数</div>
            <div class="stat-value" id="statCodes">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已使用兑换码</div>
            <div class="stat-value success" id="statUsedCodes">0</div>
          </div>
        </div>

        <!-- 选项卡 -->
        <div class="tabs">
          <button class="tab active" onclick="switchTab('codes')">兑换码管理</button>
          <button class="tab" onclick="switchTab('generate')">生成兑换码</button>
        </div>

        <!-- 兑换码列表 -->
        <div id="panelCodes" class="panel active">
          <div class="card">
            <div class="card-title">兑换码列表</div>
            <div style="margin-bottom: 16px; display: flex; gap: 12px; align-items: center;">
              <select id="filterStatus" class="form-input" style="width: 150px;" onchange="loadCodes()">
                <option value="all">全部状态</option>
                <option value="active">未使用</option>
                <option value="used">已使用</option>
                <option value="expired">已过期</option>
              </select>
              <span style="color: #999; font-size: 13px;">点击兑换码可复制</span>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>兑换码</th>
                    <th>米粒数</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>过期时间</th>
                    <th>使用时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="codesTableBody">
                </tbody>
              </table>
            </div>
            <div class="pagination" id="codesPagination">
            </div>
          </div>
        </div>

        <!-- 生成兑换码 -->
        <div id="panelGenerate" class="panel">
          <div class="card">
            <div class="card-title">批量生成兑换码</div>
            <div class="form-row">
              <div class="form-group">
                <label>米粒数量</label>
                <input type="number" class="form-input" id="genRiceAmount" value="100" min="1">
              </div>
              <div class="form-group">
                <label>生成数量</label>
                <input type="number" class="form-input" id="genCount" value="10" min="1" max="1000">
              </div>
              <div class="form-group">
                <label>有效期（天）</label>
                <input type="number" class="form-input" id="genExpiresDays" value="30" min="0">
              </div>
              <div class="form-group" style="flex: 0;">
                <button class="btn-primary btn-sm" onclick="generateCodes()" style="white-space: nowrap;">生成兑换码</button>
              </div>
            </div>
          </div>

          <div class="card" id="genResultCard" style="display: none;">
            <div class="card-title">
              生成结果
              <button class="btn-secondary btn-sm" style="float: right;" onclick="copyAllCodes()">全部复制</button>
            </div>
            <div class="code-list" id="genResultList">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const AdminState = {
      password: '',
      isLoggedIn: false,
      currentTab: 'codes',
      currentPage: 1,
      pageSize: 50,
      totalCodes: 0,
      generatedCodes: []
    };

    // ==================== 登录 ====================
    function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      if (!password) {
        showToast('请输入管理密码');
        return;
      }
      AdminState.password = password;
      AdminState.isLoggedIn = true;
      
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('adminPage').classList.remove('hidden');
      
      loadStats();
      loadCodes();
    }

    function adminLogout() {
      AdminState.password = '';
      AdminState.isLoggedIn = false;
      document.getElementById('adminPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('adminPassword').value = '';
    }

    // ==================== API 请求 ====================
    async function apiRequest(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'x-admin-password': AdminState.password,
        ...options.headers
      };

      const response = await fetch(path, { ...options, headers });
      const data = await response.json();

      if (!response.ok) {
        if (response.status === 401) {
          adminLogout();
          throw new Error('密码错误');
        }
        throw new Error(data.error || '请求失败');
      }
      return data;
    }

    // ==================== 统计 ====================
    async function loadStats() {
      try {
        const res = await apiRequest('/api/admin/stats');
        if (res.success) {
          const d = res.data;
          document.getElementById('statUsers').textContent = d.totalUsers;
          document.getElementById('statRice').textContent = d.totalRice;
          document.getElementById('statRecharge').textContent = d.totalRecharge;
          document.getElementById('statConsume').textContent = d.totalConsume;
          document.getElementById('statCodes').textContent = d.totalCodes;
          document.getElementById('statUsedCodes').textContent = d.usedCodes;
        }
      } catch (err) {
        showToast(err.message);
      }
    }

    // ==================== 选项卡 ====================
    function switchTab(tab) {
      AdminState.currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    }

    // ==================== 兑换码列表 ====================
    async function loadCodes() {
      try {
        const status = document.getElementById('filterStatus').value;
        const res = await apiRequest(`/api/admin/codes?status=${status}&page=${AdminState.currentPage}&pageSize=${AdminState.pageSize}`);
        if (res.success) {
          renderCodesTable(res.data.list);
          renderPagination(res.data.total);
        }
      } catch (err) {
        showToast(err.message);
      }
    }

    function renderCodesTable(codes) {
      const tbody = document.getElementById('codesTableBody');
      if (codes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #999;">暂无数据</td></tr>';
        return;
      }

      tbody.innerHTML = codes.map(code => {
        const statusClass = code.status;
        const statusText = code.status === 'active' ? '未使用' : code.status === 'used' ? '已使用' : '已过期';
        const expiresAt = code.expires_at ? formatDate(code.expires_at) : '永久';
        const usedAt = code.used_at ? formatDate(code.used_at) : '-';
        
        return `
          <tr>
            <td><code style="cursor: pointer; color: #FF6B9D;" onclick="copyCode('${code.code}')">${code.code}</code></td>
            <td>${code.rice_amount}</td>
            <td><span class="status ${statusClass}">${statusText}</span></td>
            <td>${formatDate(code.created_at)}</td>
            <td>${expiresAt}</td>
            <td>${usedAt}</td>
            <td><button class="btn-danger" onclick="deleteCode(${code.id})">删除</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderPagination(total) {
      AdminState.totalCodes = total;
      const totalPages = Math.ceil(total / AdminState.pageSize);
      const container = document.getElementById('codesPagination');

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = `<button class="page-btn" onclick="goToPage(${AdminState.currentPage - 1})" ${AdminState.currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;
      
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= AdminState.currentPage - 2 && i <= AdminState.currentPage + 2)) {
          html += `<button class="page-btn ${i === AdminState.currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        } else if (i === AdminState.currentPage - 3 || i === AdminState.currentPage + 3) {
          html += '<span style="padding: 6px;">...</span>';
        }
      }
      
      html += `<button class="page-btn" onclick="goToPage(${AdminState.currentPage + 1})" ${AdminState.currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
      container.innerHTML = html;
    }

    function goToPage(page) {
      AdminState.currentPage = page;
      loadCodes();
    }

    // ==================== 生成兑换码 ====================
    async function generateCodes() {
      const riceAmount = parseInt(document.getElementById('genRiceAmount').value);
      const count = parseInt(document.getElementById('genCount').value);
      const expiresDays = parseInt(document.getElementById('genExpiresDays').value);

      if (!riceAmount || riceAmount <= 0) {
        showToast('请输入有效的米粒数量');
        return;
      }
      if (!count || count <= 0 || count > 1000) {
        showToast('生成数量应在1-1000之间');
        return;
      }

      try {
        const res = await apiRequest('/api/admin/codes/generate', {
          method: 'POST',
          body: JSON.stringify({ rice_amount: riceAmount, count, expires_days: expiresDays })
        });

        if (res.success) {
          AdminState.generatedCodes = res.data.codes;
          renderGenResult(res.data.codes);
          document.getElementById('genResultCard').style.display = 'block';
          showToast(`成功生成 ${res.data.count} 个兑换码`);
          loadStats();
          loadCodes();
        }
      } catch (err) {
        showToast(err.message);
      }
    }

    function renderGenResult(codes) {
      const container = document.getElementById('genResultList');
      container.innerHTML = codes.map(code => `
        <div class="code-item" onclick="copyCode('${code}', this)">
          ${code}
          <span class="copied">已复制</span>
        </div>
      `).join('');
    }

    // ==================== 删除兑换码 ====================
    async function deleteCode(id) {
      if (!confirm('确定要删除这个兑换码吗？')) return;
      
      try {
        await apiRequest(`/api/admin/codes/${id}`, { method: 'DELETE' });
        showToast('删除成功');
        loadCodes();
        loadStats();
      } catch (err) {
        showToast(err.message);
      }
    }

    // ==================== 复制 ====================
    function copyCode(code, element) {
      navigator.clipboard.writeText(code).then(() => {
        if (element) {
          element.classList.add('copied');
          setTimeout(() => element.classList.remove('copied'), 1500);
        } else {
          showToast('已复制到剪贴板');
        }
      });
    }

    function copyAllCodes() {
      const text = AdminState.generatedCodes.join('\n');
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制全部兑换码');
      });
    }

    // ==================== 工具函数 ====================
    function formatDate(timestamp) {
      if (!timestamp) return '-';
      const d = new Date(timestamp);
      return d.getFullYear() + '-' + 
        (d.getMonth() + 1).toString().padStart(2, '0') + '-' + 
        d.getDate().toString().padStart(2, '0') + ' ' +
        d.getHours().toString().padStart(2, '0') + ':' +
        d.getMinutes().toString().padStart(2, '0');
    }

    function showToast(message, duration = 2000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // 回车登录
    document.getElementById('adminPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') adminLogin();
    });
  </script>
</body>
</html>
